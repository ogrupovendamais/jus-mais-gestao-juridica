<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#010E38"/>
  <circle cx="256" cy="256" r="210" stroke="#EBB52C" stroke-width="6" fill="none" opacity="0.35"/>
  <!-- Balança da Justiça Dourada Jus+ -->
  <g stroke="#EBB52C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Haste central vertical -->
    <line x1="256" y1="120" x2="256" y2="390" />
    <!-- Base horizontal -->
    <line x1="180" y1="390" x2="332" y2="390" stroke-width="16" />
    <path d="M210 390 L256 360 L302 390" fill="#EBB52C" />
    <!-- Topo da haste -->
    <circle cx="256" cy="110" r="14" fill="#EBB52C" />
