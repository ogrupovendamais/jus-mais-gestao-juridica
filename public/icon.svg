    <line x1="140" y1="165" x2="372" y2="165" stroke-width="14" />
    <circle cx="256" cy="165" r="8" fill="#EBB52C" />
    <!-- Prato Esquerdo -->
    <line x1="140" y1="165" x2="105" y2="245" stroke-width="6" />
    <line x1="140" y1="165" x2="175" y2="245" stroke-width="6" />
    <path d="M90 245 C90 275 190 275 190 245 Z" fill="#EBB52C" opacity="0.85" />
    <!-- Prato Direito -->
    <line x1="372" y1="165" x2="337" y2="245" stroke-width="6" />
    <line x1="372" y1="165" x2="407" y2="245" stroke-width="6" />
    <path d="M322 245 C322 275 422 275 422 245 Z" fill="#EBB52C" opacity="0.85" />
  </g>
  <!-- Texto estilizado JUS+ -->
  <text x="256" y="440" font-family="'Montserrat', sans-serif" font-weight="900" font-size="42" fill="#EBB52C" text-anchor="middle" letter-spacing="4">JUS+</text>
</svg>
